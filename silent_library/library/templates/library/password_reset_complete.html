<!--
This template extends the `base.html` template and provides the content for the password reset complete page.
-->
{% extends 'library/base.html' %}

<!--
This block overrides the `title` block in `base.html` to set a custom title for the page.
-->
{% block title %}Password Reset Complete - Silent Library{% endblock %}

<!--
This block overrides the `content` block in `base.html` to provide the main content for the page.
-->
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h2 class="card-title mb-4">Password Reset Complete!</h2>
                <p class="lead">Your password has been successfully set.</p>
                <p>You can now log in with your new password.</p>
                <hr class="my-4">
                <!--
                The `url` tag generates a URL for the login page.
                -->
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Log In Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

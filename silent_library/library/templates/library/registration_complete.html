<!--
This template extends the `base.html` template and provides the content for the registration complete page.
-->
{% extends 'library/base.html' %}

<!--
This block overrides the `title` block in `base.html` to set a custom title for the page.
-->
{% block title %}Registration Complete - Silent Library{% endblock %}

<!--
This block overrides the `content` block in `base.html` to provide the main content for the page.
-->
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Registration Complete!</h2>
                    <p class="text-center">Thank you for registering. You can now log in to your account.</p>
                    <div class="text-center">
                        <!--
                        The `url` tag generates a URL for the login page.
                        -->
                        <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

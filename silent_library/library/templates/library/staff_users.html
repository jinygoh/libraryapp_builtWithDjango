{% extends 'library/base.html' %}

{% block content %}
  <h2>Manage Users</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Blocked</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
        <tr>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.is_blocked }}</td>
          <td>
            {% if user.is_blocked %}
              <a href="{% url 'unblock_user' user.id %}" class="btn btn-success">Unblock</a>
            {% else %}
              <a href="{% url 'block_user' user.id %}" class="btn btn-danger">Block</a>
            {% endif %}
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
